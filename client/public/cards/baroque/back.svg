<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Classic Baroque card back: cream stock and a vermilion keyline like the
       faces, around a lacquer-red field with a gold lattice and medallion. -->
  <defs>
    <pattern id="lattice" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45 50 70)">
      <path d="M0 0H10M0 0V10" stroke="#E2BE6A" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="5" cy="5" r="1.1" fill="#E2BE6A" fill-opacity="0.5"/>
    </pattern>
    <radialGradient id="field" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#A82A22"/>
      <stop offset="1" stop-color="#6E1512"/>
    </radialGradient>
  </defs>
  <rect width="100" height="140" rx="6" fill="#F6EEDC"/>
  <rect x="4" y="4" width="92" height="132" rx="3.5" fill="none" stroke="#D2563C" stroke-width="1.2"/>
  <rect x="8" y="8" width="84" height="124" rx="2" fill="url(#field)"/>
  <rect x="8" y="8" width="84" height="124" rx="2" fill="url(#lattice)"/>
  <rect x="11" y="11" width="78" height="118" rx="1.5" fill="none" stroke="#E8C468" stroke-width="1.4"/>
  <rect x="13.5" y="13.5" width="73" height="113" rx="1" fill="none" stroke="#E8C468" stroke-opacity="0.6" stroke-width="0.6"/>
  <!-- Medallion: a jade disc with a gold rim, echoing the Jade ace -->
  <circle cx="50" cy="70" r="17" fill="#6E1512" stroke="#E8C468" stroke-width="2"/>
  <circle cx="50" cy="70" r="12.5" fill="#2F7D55" stroke="#F1DC9C" stroke-width="1"/>
  <circle cx="50" cy="70" r="4.5" fill="#6E1512" stroke="#F1DC9C" stroke-width="0.8"/>
  <path d="M50 49v-5M50 91v5M29 70h-5M71 70h5" stroke="#E8C468" stroke-width="1.6" stroke-linecap="round"/>
</svg>
