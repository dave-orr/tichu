<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>
<filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3" result="w"/>
  <feDisplacementMap in="SourceGraphic" in2="w" scale="1.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feDropShadow in="d" dx="0.4" dy="1.2" stdDeviation="0.7" flood-color="#2B2233" flood-opacity="0.35"/>
</filter>
<filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="t"/>
  <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.33  0 0 0 0 0.25  0 0 0 0 0.17  0.3 0 0 0 -0.12" result="g"/>
  <feComposite in="g" in2="SourceAlpha" operator="in" result="grain"/>
  <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
</filter>
</defs><g filter="url(#paper)" stroke="#2B2233" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><g filter="url(#cut)"><g transform="rotate(-38 50 50)"><path d="M50 6 L55 14 L55 66 L45 66 L45 14 Z" fill="#B9C3CF"/><path d="M50 9 L50 64" stroke="#7F8C9C" stroke-width="1.4"/><path d="M36 66 Q50 72 64 66 L64 71 Q50 77 36 71 Z" fill="#E8AA38"/><rect x="46" y="73" width="8" height="15" rx="2" fill="#3A2A33"/><circle cx="50" cy="91" r="4" fill="#E8AA38"/><path d="M50 95 Q46 100 44 99 M50 95 Q54 100 56 99" fill="none" stroke="#D93A3A" stroke-width="2.4"/></g></g><g filter="url(#cut)"><g transform="rotate(38 50 50)"><path d="M50 6 L55 14 L55 66 L45 66 L45 14 Z" fill="#B9C3CF"/><path d="M50 9 L50 64" stroke="#7F8C9C" stroke-width="1.4"/><path d="M36 66 Q50 72 64 66 L64 71 Q50 77 36 71 Z" fill="#E8AA38"/><rect x="46" y="73" width="8" height="15" rx="2" fill="#3A2A33"/><circle cx="50" cy="91" r="4" fill="#E8AA38"/><path d="M50 95 Q46 100 44 99 M50 95 Q54 100 56 99" fill="none" stroke="#D93A3A" stroke-width="2.4"/></g></g></g></svg>
